[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-financial-crime-ml-intelligence-platform"
version = "0.1.0"
description = "Local-first, GCP-aligned financial crime ML intelligence platform scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Portfolio Project" }
]
dependencies = [
  "Jinja2",
  # M6M state backups (scripts/state_backup.py): AES-256-GCM. Tested at both bounds.
  "cryptography>=46.0.0,<51",
  "PyYAML",
  "matplotlib",
  "networkx",
  "numpy",
  # <3: the synthetic v2 contract relies on object-dtype string columns; pandas 3 defaults
  # to the new str dtype. Both bounds tested in clean environments (M6M).
  "pandas>=2.2,<3",
  "pydantic",
  "scikit-learn"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]

[project.scripts]
financial-crime-ml = "financial_crime_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

